name: Robot OutilGraphique

on:
  schedule:
    - cron: '23 * * * *'   # toutes les heures, à la 23e minute
  workflow_dispatch:
    inputs:
      test:
        description: 'Réannoncer le dernier outil sur Discord et Are.na (pour tester)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: robot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lire le site, mettre à jour le flux, annoncer les nouveautés
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ARENA_TOKEN: ${{ secrets.ARENA_TOKEN }}
          ARENA_CHANNEL: ${{ vars.ARENA_CHANNEL }}
          TEST_ANNOUNCE: ${{ inputs.test }}
        run: python3 robot.py
      - name: Enregistrer le flux
        run: |
          git config user.name "Robot OutilGraphique"
          git config user.email "robot@users.noreply.github.com"
          git add feed.xml state.json
          git diff --cached --quiet || (git commit -m "Flux mis à jour" && git push)
